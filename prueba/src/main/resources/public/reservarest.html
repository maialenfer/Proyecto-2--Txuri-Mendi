<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Mesa | Restaurante Urgull</title>
    <link rel="stylesheet" href="stylereservarest.css">
</head>
<body>
<div class="container-reserva">
    <form class="formulario" action="/reservar-mesa" method="POST">
        <a href="restaurante.html" class="link-atras">← Ver la carta</a>
        <h2>Reserva tu Mesa</h2>
        
        <div class="campo">
            <label>Número de comensales</label>
            <select name="personas" required>
                <option value="1">1 Persona</option>
                <option value="2">2 Personas</option>
                <option value="3">3 Personas</option>
                <option value="4">4 Personas</option>
            </select>
        </div>

        <div class="fecha-grid">
            <div class="campo">
                <label>Día</label>
                <input type="date" name="dia" required>
            </div>
            <div class="campo">
                <label>Hora</label>
                <select name="hora" required>
                    <option value="13:30">13:30</option>
                    <option value="14:00">14:00</option>
                    <option value="21:00">21:00</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-enviar">Confirmar Reserva</button>
    </form>
</div>
</body>
</html>
