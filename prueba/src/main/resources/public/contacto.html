<link rel="stylesheet" href="stylecontacto.css">
<section id="contact" class="contact">

    <div class="container">
        <a href="index.html" class="link-atras">← Volver al inicio</a>

        <h2 class="contact-titulo">Contacto</h2>
        <p class="contact-subtitulo">¿Tienes alguna pregunta? ¡Ponte en contacto con nosotros!</p>
        
        <form action="/contactar" method="POST" class="contact-form">
            
            <input type="text" name="nombre" placeholder="Nombre" required>
            
            <input type="email" name="email" placeholder="Correo electrónico" required>
            
            <textarea name="mensaje" placeholder="Mensaje" required></textarea>
            
            <button type="submit" class="btn">Enviar</button>
        </form>
    </div>
</section>
