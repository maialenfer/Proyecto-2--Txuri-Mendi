<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Usuarios | TXURI MENDI</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

    <div class="container">
        <form class="formulario" action="/login" method="POST">
            <a href="index.html" class="link-atras">← Volver al inicio</a>

            <h2>Acceso Usuarios</h2>
            
            <div class="campo">
                <label>Usuario</label>
                <input type="text" name="usuario" placeholder="Introduce tu usuario" required>
            </div>
            
            <div class="campo">
                <label>Contraseña</label>
                <input type="password" name="contrasena" placeholder="Introduce tu contraseña" required>
            </div>
            
            <p class="instruccion">Introduce tus credenciales para acceder al sistema</p>
            
            <p style="font-size: 11px; color: #999; text-align: center; margin-bottom: 15px;">
              
            </p>

            <div class="botones-container">
                <button type="submit" class="btn-acceso">
                    Iniciar Sesión
                </button>
                
                <div class="registro-link" style="margin-top: 20px; text-align: center;">
                    <p style="font-size: 14px; color: #666; margin-bottom: 5px;">¿No tienes usuario?</p>
                    <a href="registro.html" class="btn-registro" style="text-decoration: none; color: #007bff; font-weight: bold; border: 1px solid #007bff; padding: 5px 10px; border-radius: 5px; display: inline-block;">
                        Regístrate aquí
                    </a>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
