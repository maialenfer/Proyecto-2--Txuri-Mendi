<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Mesa | Restaurante Urgull</title>
    <link rel="stylesheet" href="stylereservarest.css">
</head>
<body>
<div class="container-reserva">
    <form class="formulario" action="/reservar-mesa" method="POST">
        <a href="restaurante.html" class="link-atras">← Ver la carta</a>
        <h2>Reserva tu Mesa</h2>
        
<div class="campo">
    <label for="personas">Número de comensales</label>
    <div style="display: flex; gap: 10px; align-items: center;">
        <select name="comensales" id="personas" required onchange="toggleMasInput()">
            <option value="" disabled selected>Selecciona...</option>
            <option value="1">1 Persona</option>
            <option value="2">2 Personas</option>
            <option value="3">3 Personas</option>
            <option value="4">4 Personas</option>
            <option value="mas">Más de 4...</option>
        </select>

        <input type="number" 
               id="input_mas" 
               name="cantidad_exacta" 
               placeholder="¿Cuántos?" 
               min="5" 
               style="display: none; width: 100px; padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
    </div>
</div>

<script>
function toggleMasInput() {
    const select = document.getElementById('personas');
    const inputMas = document.getElementById('input_mas');
    
    if (select.value === 'mas') {
        inputMas.style.display = 'block'; // Muestra el cuadro
        inputMas.required = true;         // Obliga a rellenarlo
        inputMas.focus();                 // Pone el cursor dentro automáticamente
    } else {
        inputMas.style.display = 'none';  // Lo oculta
        inputMas.required = false;        // Quita la obligatoriedad
        inputMas.value = '';              // Limpia lo escrito
    }
}
</script>

        <div class="fecha-grid">
            <div class="campo">
                <label>Día</label>
                <input type="date" name="dia" required>
            </div>
            <div class="campo">
                <label>Hora</label>
                <select name="hora" required>
                    <option value="13:30">13:30</option>
                    <option value="14:30">14:30</option>
                    <option value="21:00">21:00</option>
                </select>
            </div>
        </div>

        <div class="campo">
            <label>Ubicación preferida</label>
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <label><input type="radio" name="sitio" value="Interior" checked> Interior</label>
                <label><input type="radio" name="sitio" value="Terraza"> Terraza</label>
            </div>
        </div>

        <button type="submit" class="btn-enviar">Confirmar Reserva</button>
    </form>
</div>
</body>
</html>
